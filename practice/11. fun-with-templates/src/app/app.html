<div class="colors-area">
	<app-item-selector title="Color" [options]="possibleColors()" [(selectedOption)]="selectedColor">
		<div class="color-container" [style.--color-option]="option"
			*appItemContainerTemplate="let option; let selected = selected; let onSelect = onSelect" [class.chosen]="selected"
			(click)="onSelect()">
			<div class="color-preview">
				<span>{{ option }}</span>
			</div>
		</div>
		<!-- <span *appItemTemplate="let option" [style.color]="option">{{ option }}</span> -->
	</app-item-selector>
</div>

<div class="fonts-area">
	<app-item-selector title="Font" [options]="possibleFonts()" [(selectedOption)]="selectedFont">
		<span *appItemTemplate="let option" [style.font-family]="option">{{ option }}</span>
	</app-item-selector>
</div>

<div class="sizes-area">
	<app-item-selector title="Size" [options]="possibleSizes()" [(selectedOption)]="selectedSize">
		<span *appItemTemplate="let option" [style.font-size]="option">{{ option }}</span>
	</app-item-selector>
</div>

<div class="editor-area">
	<textarea placeholder="Type your text here..." [style.color]="selectedColor()" [style.font-family]="selectedFont()"
		[style.font-size]="selectedSize()"></textarea>
</div>
